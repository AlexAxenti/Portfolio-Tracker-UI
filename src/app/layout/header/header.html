<header class="site-header">
  <a class="brand-link" routerLink="/dashboard" aria-label="Portfolio Tracker dashboard">
    Portfolio Tracker
  </a>

  <nav class="primary-nav" aria-label="Primary navigation">
    <a
      class="nav-link"
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Dashboard
    </a>
    <a class="nav-link" routerLink="/dashboard/holdings" routerLinkActive="active">
      Holdings
    </a>
    <a class="nav-link" routerLink="/dashboard/trades" routerLinkActive="active">
      Trades
    </a>
  </nav>

  <button mat-flat-button class="header-trade-button" type="button" (click)="onAddTrade()">
    Add Trade
  </button>

  <button
    class="profile-avatar"
    type="button"
    aria-label="Log out"
    title="Log out"
    (click)="onLogout()"
  >
    <span class="profile-icon"></span>
  </button>
</header>
