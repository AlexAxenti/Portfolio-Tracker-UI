<header class="site-header">
  <a class="brand-link" routerLink="/" aria-label="Portfolio Tracker home">
    Portfolio Tracker
  </a>

  <nav class="primary-nav" aria-label="Primary navigation">
    <a
      class="nav-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Dashboard
    </a>
    <a class="nav-link" routerLink="/holdings" routerLinkActive="active">
      Holdings
    </a>
    <a class="nav-link" routerLink="/trades" routerLinkActive="active">
      Trades
    </a>
  </nav>

  <button mat-flat-button class="header-trade-button" type="button" (click)="onAddTrade()">
    Add Trade
  </button>

  <div class="profile-avatar" aria-hidden="true">
    <span class="profile-icon"></span>
  </div>
</header>
