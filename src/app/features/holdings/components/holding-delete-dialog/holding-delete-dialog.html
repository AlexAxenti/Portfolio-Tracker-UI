<h2 mat-dialog-title>Delete Holding</h2>

<mat-dialog-content>
  <p>
    Are you sure you want to delete {{ holding.ticker }}?
  </p>

  @if (errorMessage) {
    <p class="error-message">{{ errorMessage }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-flat-button type="button" (click)="onConfirm()">Delete</button>
</mat-dialog-actions>
