<section class="holdings-panel" aria-labelledby="holdings-title">
  <div class="panel-header">
    <div>
      <p class="eyebrow">Holdings</p>
      <h1 id="holdings-title">Your Holdings</h1>
      <p class="subtitle">Track current positions and unrealized gains</p>
    </div>

    <div class="header-actions">
      <button
        mat-stroked-button
        class="header-action"
        type="button"
        [disabled]="isRefreshingPrices()"
        [attr.aria-busy]="isRefreshingPrices()"
        (click)="onRefreshPrices()"
      >
        @if (isRefreshingPrices()) {
          Refreshing...
        } @else {
          Refresh Prices
        }
      </button>

      <button mat-flat-button class="header-action" type="button" (click)="onAddHolding()">
        Add Holding
      </button>
    </div>
  </div>

  @if (isLoadingHoldings()) {
    <div class="loading-state" role="status" aria-live="polite">
      <span class="loading-dot" aria-hidden="true"></span>
      Loading holdings...
    </div>
  } @else if (sortedHoldingViews().length === 0) {
    <p class="empty-state">No holdings yet.</p>
  } @else {
    <div class="holdings-content">
      <div class="chart-column">
        <app-holdings-allocation-chart
          [holdingViews]="sortedHoldingViews()"
          [dashboardMode]="false"
          (sortChanged)="onSortChanged($event)"
          (sliceSelected)="onChartSliceSelected($event)"
        />
      </div>

      <div class="table-column">
        <app-holdings-table
          [holdingViews]="sortedHoldingViews()"
          [selectedHoldingId]="selectedHoldingId()"
          [dashboardMode]="false"
          (editRequested)="onUpdateHolding($event)"
          (deleteRequested)="onDeleteHolding($event)"
        />
      </div>
    </div>
  }
</section>
